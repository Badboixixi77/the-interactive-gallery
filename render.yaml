services:
  # Backend API
  - type: web
    name: interactive-gallery-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: interactive-gallery-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

  # Frontend (Static Site)
  - type: web
    name: interactive-gallery-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: REACT_APP_UNSPLASH_ACCESS_KEY
        sync: false

databases:
  - name: interactive-gallery-db
    databaseName: interactive_gallery
    plan: free
services:
  # Backend API
  - type: web
    name: interactive-gallery-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: interactive-gallery-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: interactive-gallery-frontend
          type: web
          property: host

  # Frontend
  - type: web
    name: interactive-gallery-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          name: interactive-gallery-api
          type: web
          property: host
          envSuffix: url
      - key: REACT_APP_UNSPLASH_ACCESS_KEY
        sync: false

databases:
  - name: interactive-gallery-db
    databaseName: interactive_gallery
    plan: free
    region: frankfurt
